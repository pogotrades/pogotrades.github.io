<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/r/PokemonGoTrade Rarity Tier List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: black;
        }
        h1 {
            text-align: center;
            color: #fff;
        }
        p {
            color: #bbb;
        }
        .tier-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: white;
border-radius: 12px;
margin-bottom: 12px;
        }

        .tier {
            background-color: #111111;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .tier h2 {
            margin-top: 0;
        }
        .tier-items {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }
.tier-item {
    text-align: center;
    position: relative;
    width: 80px;
    height: 80px;
    overflow: hidden;
    border-radius: 0px;
}
.tier-item img {
    width: 70px;
    height: 70px;
    object-fit: contain;
    border-radius: 0px;
    position: absolute;
    top: 0;
    left: 0;
}
.background {
    z-index: 0;
    opacity: 0.65;
}

html {
    height: 100%; /* Ensure html has full height */
}

body {
    overflow-y: scroll; /* Only force the vertical scrollbar here */
    height: 100%; /* Ensure body takes full height */
    margin: 0;
}

.tier-item .background {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-52%, -30%);
    width: 170%;
    height: 170%;
    object-fit: cover;
    z-index: 0;
    border-radius: 10px;
    border: 2px solid #111;
}
.top {
    z-index: 1;
}
.tier-item .top {
    position: absolute;
    top: 10%;
    left: 10%;
    width: 80%;
    height: 80%;
    object-fit: contain;
    z-index: 1;
}

ul {
  list-style-type: none;
padding-inline-start: 0
}

#myInput {
  background-color: #111111;
  padding: 12px 20px 12px 40px; /* Add some padding */
  border: 1px solid #666666; /* Add a grey border */
  margin-bottom: 12px; /* Add some space below the input */
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: white;
width: calc(100% - 60px);
font-size: 16px;
}

    </style>
</head>
<body>
    <h1>r/PokemonGoTrade Rarity Tier List</h1>

    <div id="html-content">
    </div>

    <script>

        async function fetchHtmlFromSheet() {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/1dHOdFy9U9NARS45Cc14K5v_JAcVzCYa6fcYVtXlk7_g/values/Sheet1!F1:F9999?key=AIzaSyAVF_cJZiGHJm9ImFnK2Ed2S_2Lm_k86Q8`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.values && data.values.length > 0) {
                    const htmlContent = data.values.map(row => row[0]).join('');
                    insertHtml(htmlContent);
                } else {
                    console.error('No data found.');
                }
            } catch (error) {
                console.error('Error fetching data from Google Sheets:', error);
            }
        }

        function insertHtml(htmlContent) {
            const contentDiv = document.getElementById('html-content');
            contentDiv.innerHTML = htmlContent;
        }

        fetchHtmlFromSheet();

function myFunction() {
    var input, filter, uls, ul, li, a, i, txtValue;
    
    // Get the search input
    input = document.getElementById("myInput");
    filter = input.value.toUpperCase();

    // Get all <ul> elements with class "filterlist"
    uls = document.querySelectorAll(".filterlist");

    // Loop through each <ul>
    uls.forEach(function(ul) {
        li = ul.getElementsByTagName("li");

        // Loop through each <li> inside the <ul>
        for (i = 0; i < li.length; i++) {
            a = li[i].getElementsByTagName("a")[0];
            txtValue = a.textContent || a.innerText;

            // Check if the text matches the filter and show/hide list items
            if (txtValue.toUpperCase().indexOf(filter) > -1) {
                li[i].style.display = "";
            } else {
                li[i].style.display = "none";
            }
        }
    });
}

function updateAllOuterVisibility() {

    const outers = document.querySelectorAll(".tier-container");

    outers.forEach((outer, index) => {
        const inner = outer.querySelector(".tier-items");
        if (!inner) {
            return;
        }

        const children = Array.from(inner.children);
        const allHidden = children.every(child => {
            const display = window.getComputedStyle(child).display;
            console.log(`Child display: ${display}`);
            return display === "none";
        });

        outer.style.display = allHidden ? "none" : "";
    });
}

document.getElementById("html-content")
.addEventListener("input", () => {
    requestAnimationFrame(updateAllOuterVisibility);
myFunction()
});

    </script>
</body>
</html>
